<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ben's World</title>
<meta name="theme-color" content="#0b0b12">
<link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0b12;color:#f2f2f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:560px}
h1{font-size:40px;font-weight:900;letter-spacing:.04em;margin:0 0 6px;background:linear-gradient(90deg,#ff3d7f,#ffb43d,#3dd9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:#8a8aa3;margin:0 0 28px}
a.card{display:block;text-decoration:none;color:inherit;background:#15151f;border:1px solid #2a2a3a;border-radius:16px;padding:18px 20px;margin-bottom:12px;transition:.15s}
a.card:hover,a.card:active{border-color:var(--c);transform:translateY(-2px)}
a.card b{font-size:20px;display:flex;align-items:center;gap:10px}
a.card b:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
a.card span{display:block;color:#8a8aa3;margin-top:6px;font-size:15px}
</style>
</head>
<body>
<main>
  <h1>BEN'S WORLD</h1>
  <p class="sub">Tools for making music and films with friends.</p>
  <a class="card" href="beatjam/" style="--c:#ff3d7f"><b>Beat Jam</b><span>Pass the loop: everyone adds one, the beat grows.</span></a>
  <a class="card" href="storyboard/" style="--c:#3dd9ff"><b>Slate</b><span>Plan shots, sketch frames, see who films what.</span></a>
</main>
</body>
</html>
